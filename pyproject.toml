[project]
name = "wigos-node-poc"
version = "0.14.0"
description = "Proof of concept WIGOS node for reviewing and editing WMDR2 full records"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jsonschema>=4.17",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:ddtrace", "-p", "no:asyncio"]

[tool.ruff]
line-length = 100
